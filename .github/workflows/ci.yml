name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secret-scan:
    # Full-tree secret scan, blocking. Pinned gitleaks version; --redact so no
    # matched material appears in CI logs; --no-git scans the checked-out tree.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks full-tree scan
        run: gitleaks detect --no-git --redact --source .

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install
        # torch first, from the CPU index only: PyPI's Linux torch is the CUDA
        # build, and --extra-index-url would also look numpy and the rest up on
        # the torch index. The +cpu build then satisfies pyproject's pin, so the
        # second install leaves it alone. pip itself is not upgraded, so no
        # unpinned release enters the job. pip check fails the job on any
        # inconsistency that pip install only warns about.
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest tests/ -q --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=90
