[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-from-scratch"
version = "0.0.1"
description = "Reinforcement learning from first principles: neural networks, tabular methods and DQN"
requires-python = ">=3.11"
# Every pin was uploaded at least 14 days before it was chosen. CI installs
# torch from the CPU index first (.github/workflows/ci.yml); its +cpu build
# satisfies the pin below.
dependencies = [
    "numpy==2.4.6",
    "torch==2.14.1",
    "gymnasium==1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",     # pinned so pytest-cov cannot pull a newer one
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"          # CI runs Python 3.11

[tool.ruff.format]
# ruff >= 0.16 formats fenced Python blocks inside Markdown; the docs are
# records, not formatter targets.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings)
    "UP",   # pyupgrade (modern syntax)
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "E501",  # line too long (line-length=88 still governs the formatter)
    "N803",  # argument name should be lowercase (allow math notation, e.g. Q)
    "N806",  # variable in function should be lowercase (allow math notation)
    "N816",  # mixedCase variable in global scope
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]                # tests don't need docstrings

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
# Put the repo root on sys.path so `from src.… import …` resolves under the
# `pytest` console-script (which, unlike `python -m pytest`, does not prepend
# cwd). Makes `pytest tests/` the canonical, reproducible invocation.
pythonpath = ["."]
